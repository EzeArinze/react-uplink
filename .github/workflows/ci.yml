name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege default: this workflow only reads the repo and runs
# checks — it never needs to write anything (no releases, no comments,
# no pushes). Being explicit here means a fork PR can't get more than
# read access even if the org's default GITHUB_TOKEN permissions are
# broader.
permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm + Node ${{ matrix.node }}
        uses: pnpm/setup@v1

        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Verify build output exists
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/index.d.cts
